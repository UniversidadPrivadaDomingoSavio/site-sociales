<!doctype html>
<html lang="es" class="h-100">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galería · UPDS INVESTIGA 2026</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css"/>
<link rel="stylesheet" href="css/styles.css"/>
<link rel="icon" type="image/png" href="img/logo_32x32.png"/>
<style>
/* Usa los estilos de Ponencias del CSS compartido para el banner y las fechas.
   Aquí solo se define la cuadrícula de fotos y su ampliación. */
/* Banner y fechas heredan las reglas de .page-ponencias en css/styles.css. */

.page-galeria .hero-strip {
  left:auto; right:auto; margin-left:25px; margin-right:25px;
}
.page-galeria .gallery-day {display:none;}
.page-galeria .gallery-day.active {display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:1rem;}
.page-galeria .gallery-item {display:block;width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--ponencias-accent-soft);cursor:pointer;position:relative;transition:transform .3s,box-shadow .3s;}
.page-galeria .gallery-item:hover {transform:scale(1.03);box-shadow:0 12px 32px rgba(6,61,87,.18);}
.page-galeria .gallery-item img {width:100%;height:100%;object-fit:cover;display:block;}
.page-galeria .gallery-item__overlay {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:background .3s;}
.page-galeria .gallery-item:hover .gallery-item__overlay,
.page-galeria .gallery-item:focus-visible .gallery-item__overlay {background:rgba(6,61,87,.3);}
.page-galeria .gallery-item__overlay span {color:white;font-size:2rem;opacity:0;}
.page-galeria .gallery-item:hover .gallery-item__overlay span,
.page-galeria .gallery-item:focus-visible .gallery-item__overlay span {opacity:1;}
.page-galeria .gallery-empty {grid-column:1 / -1;text-align:center;padding:4rem 2rem;color:var(--ponencias-accent);}
.page-galeria .gallery-empty span {font-size:3rem;display:block;margin-bottom:.8rem;}
.page-galeria .gallery-empty p {font-size:1rem;font-weight:600;margin:0;line-height:1.7;}
.page-galeria .gallery-empty small {display:block;margin-top:.6rem;color:var(--ponencias-text-muted);}
.page-galeria .lightbox {width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:24px;border:0;background:rgba(0,0,0,.94);color:white;}
.page-galeria .lightbox[open] {display:flex;align-items:center;justify-content:center;}
.page-galeria .lightbox::backdrop {background:rgba(0,0,0,.8);}
.page-galeria .lightbox img {max-width:90vw;max-height:85dvh;border-radius:12px;object-fit:contain;}
.page-galeria .lightbox__close {position:absolute;top:16px;right:20px;width:44px;height:44px;border:1px solid #82929b;border-radius:50%;color:white;background:#123041;font-size:1.8rem;cursor:pointer;}
.page-galeria button:focus-visible {outline:3px solid var(--color-accent);outline-offset:4px;}
@media(max-width:991.98px){
 .page-galeria .hero-strip {flex-direction:column;min-height:0;height:auto;margin-left:16px;margin-right:16px;}
 .page-galeria .hero-strip__media {flex-basis:auto;height:210px;}
 .page-galeria .hero-strip__panel {padding:1.4rem;}
}
@media(prefers-reduced-motion:reduce){.page-galeria .date-tab,.page-galeria .gallery-item {transition:none;transform:none;}}

</style>
</head>
<body class="page-galeria page-ponencias d-flex flex-column h-100">
<div class="page-wrap d-flex flex-column min-vh-100">
  <div class="bg-right d-none d-lg-block" aria-hidden="true"></div>
  <div id="header-placeholder"></div>
  <main class="flex-shrink-0 content-padding page-content">
    <section class="hero-strip my-4">
      <div class="hero-strip__media">
        <video autoplay muted loop playsinline preload="metadata" aria-hidden="true">
          <source src="media/Technology Background.mp4" type="video/mp4"/>
        </video>
      </div>
      <div class="hero-strip__panel"><h1 class="hero-strip__title">Galería</h1></div>
    </section>
    <div class="container my-5">
      <div class="date-tabs" role="group" aria-label="Seleccionar día del evento">
        <button type="button" class="date-tab active" aria-pressed="true" aria-controls="dia1" onclick="switchDay('dia1',this)">
          <span class="date-tab__day">20</span><span class="date-tab__month">Octubre 2026</span>
        </button>
        <button type="button" class="date-tab" aria-pressed="false" aria-controls="dia2" onclick="switchDay('dia2',this)">
          <span class="date-tab__day">21</span><span class="date-tab__month">Octubre 2026</span>
        </button>
      </div>
      <div class="gallery-day active" id="dia1" role="region" aria-label="Fotografías del 20 de octubre">
        <!-- Al publicar las fotos, eliminar .gallery-empty y copiar este bloque:
        <button type="button" class="gallery-item" aria-label="Ampliar fotografía">
          <img src="Galeria/20/foto1.jpg" alt="Descripción de la fotografía" loading="lazy"/>
          <div class="gallery-item__overlay" aria-hidden="true"><span>⌕</span></div>
        </button>
        -->
        <div class="gallery-empty">
          <span aria-hidden="true">📷</span>
          <p>Las fotografías del 20 de octubre se subirán el día del evento.</p>
          <small>Próximamente podrás ver aquí los momentos de la primera jornada.</small>
        </div>
      </div>
      <div class="gallery-day" id="dia2" role="region" aria-label="Fotografías del 21 de octubre">
        <!-- Al publicar las fotos, eliminar .gallery-empty y copiar este bloque:
        <button type="button" class="gallery-item" aria-label="Ampliar fotografía">
          <img src="Galeria/21/foto1.jpg" alt="Descripción de la fotografía" loading="lazy"/>
          <div class="gallery-item__overlay" aria-hidden="true"><span>⌕</span></div>
        </button>
        -->
        <div class="gallery-empty">
          <span aria-hidden="true">📷</span>
          <p>Las fotografías del 21 de octubre se subirán el día del evento.</p>
          <small>Próximamente podrás ver aquí los momentos de la segunda jornada.</small>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder" class="mt-auto"></div>
</div>
<dialog class="lightbox" id="lightbox" aria-label="Fotografía ampliada">
  <button type="button" class="lightbox__close" aria-label="Cerrar fotografía" onclick="closeLightbox()" autofocus>×</button>
  <img id="lightbox-img" alt=""/>
</dialog>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script>
function switchDay(dayId, btn) {
  const panel = document.getElementById(dayId);
  if (!panel) return;
  document.querySelectorAll('.page-galeria .gallery-day').forEach(day => day.classList.remove('active'));
  document.querySelectorAll('.page-galeria .date-tab').forEach(tab => {
    tab.classList.remove('active');
    tab.setAttribute('aria-pressed', 'false');
  });
  panel.classList.add('active');
  btn.classList.add('active');
  btn.setAttribute('aria-pressed', 'true');
}
const lightbox = document.getElementById('lightbox');
let previousOverflow = '';
document.addEventListener('click', event => {
  const item = event.target.closest('.page-galeria .gallery-item');
  if (!item) return;
  const image = item.querySelector('img');
  if (!image) return;
  const enlarged = document.getElementById('lightbox-img');
  enlarged.src = image.src;
  enlarged.alt = image.alt;
  previousOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  lightbox.showModal();
});
function closeLightbox() { lightbox.close(); }
lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
// El diálogo nativo admite Escape y devuelve el foco al cerrar.
lightbox.addEventListener('close', () => {
  document.body.style.overflow = previousOverflow;
  document.getElementById('lightbox-img').removeAttribute('src');
});
</script>
</body>
</html>
